<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ufficio Comunicazione — AI Hub</title>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
    .badge { font-size: 0.78rem; background: #0284c733; color: var(--accent); padding: 4px 10px; border-radius: 999px; border: 1px solid #38bdf855; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
    label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #e2e8f0; }
    select, input[type="text"], input[type="password"], textarea {
      width: 100%; background: #0f172a; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; margin-bottom: 14px;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .btn {
      background: var(--accent); color: #0f172a; font-weight: 700; border: none; border-radius: 8px;
      padding: 12px 18px; font-size: 0.95rem; cursor: pointer; transition: 0.15s;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #f8fafc; font-weight: 600; padding: 8px 14px; font-size: 0.85rem; }
    .btn-secondary:hover { background: #475569; }
    .file-box { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; background: #0f172a88; margin-bottom: 14px; }
    .auto-doc-banner { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 0.85rem; }
    .status { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .output-box { white-space: pre-wrap; line-height: 1.6; font-size: 0.96rem; background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .api-bar { display: flex; gap: 8px; align-items: center; }
    .api-bar input { margin-bottom: 0; }
    .pill-ok { color: var(--success); font-size: 0.84rem; font-weight: 600; }
    .pill-warn { color: var(--warn); font-size: 0.84rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>UFFICIO COMUNICAZIONE — AI HUB</h1>
        <div class="status">Clone fedele dei tuoi template Word + Generatore Copy</div>
      </div>
      <span class="badge">GitHub Pages + Gemini Auto-Sync</span>
    </header>

    <!-- CONFIGURAZIONE CHIAVE API PRIVATA NEL BROWSER -->
    <div class="card">
      <label>Chiave API Google AI Studio (salvata solo nel tuo browser, mai su GitHub)</label>
      <div class="api-bar">
        <input type="password" id="apiKeyInput" placeholder="Incolla qui la tua chiave API (AIzaSy... o AQ....)" />
        <button class="btn btn-secondary" onclick="salvaApiKey()">Salva Chiave</button>
      </div>
      <div id="apiStatus" class="status"></div>
    </div>

    <!-- FORM OPERATIVO -->
    <div class="card">
      <div class="row">
        <div>
          <label for="cliente">1. Cliente / Progetto</label>
          <select id="cliente" onchange="caricaDocAutomatico()">
            <option value="Manfredonia Calcio 1932 — Prima Squadra" data-doc="MANFREDONIA_CALCIO_PRIMASQUADRA.docx">Manfredonia Calcio 1932 — Prima Squadra</option>
            <option value="Manfredonia Calcio — Settore Giovanile (U19/U17/U15/U14)" data-doc="MANFREDONIA_CALCIO_SETTOREGIOVANILE.docx">Manfredonia Calcio — Settore Giovanile (U19/U17/U15/U14)</option>
            <option value="Market Troiano (Manfredonia)" data-doc="MARKET_TROIANO.docx">Market Troiano (Manfredonia)</option>
            <option value="ASD G Events / The Cage Events" data-doc="ASD_G_EVENTS.docx">ASD G Events / The Cage Events</option>
            <option value="Tenuta Santa Lucia" data-doc="TENUTA_SANTA_LUCIA.docx">Tenuta Santa Lucia</option>
            <option value="Tabacchi Trotta" data-doc="TABACCHI_TROTTA.docx">Tabacchi Trotta</option>
            <option value="Tucson Angel Manfredonia" data-doc="TUCSON_ANGEL.docx">Tucson Angel Manfredonia</option>
            <option value="Altro Cliente" data-doc="">Altro Cliente</option>
          </select>
        </div>

        <div>
          <label for="modalita">2. Modalità di Lavoro</label>
          <select id="modalita">
            <option value="Standard">Standard (Solo Copy fedele al Word + Storie)</option>
            <option value="Extra">Extra (Copy + Storie + Concept Grafico + Prompt AI)</option>
          </select>
        </div>
      </div>

      <!-- STATO CARICAMENTO AUTOMATICO DA GITHUB /dati -->
      <div class="auto-doc-banner" id="autoDocStatus">
        Verifica documento cliente su GitHub in corso...
      </div>

      <!-- CARICAMENTO FILE WORD (.DOCX) O TXT EXTRA DAL DISPOSITIVO -->
      <div class="file-box">
        <label for="fileInput">3. Allega un ulteriore File Word (.docx) o Testo (.txt) dal PC/Telefono (Opzionale)</label>
        <input type="file" id="fileInput" accept=".docx,.txt,.md" onchange="leggiFileLocale(event)" />
        <div id="fileStatus" class="status">Serve solo se hai un file extra al momento (es. distinta gara o comunicato LND del giorno).</div>
      </div>

      <label for="appunti">4. Tipo di Post e Dati da Inserire (es. "Next match: Francavilla - Manfredonia, 13^ giornata...")</label>
      <textarea id="appunti" placeholder="Scrivi che post ti serve (es. Next Match, Riscaldamento, Formazione, Half Time, Full Time, Offerta) e i dati reali (squadre, giornata, data, ora, stadio, città, marcatori)..."></textarea>

      <button class="btn" id="btnGenera" onclick="generaContenuto()" style="width: 100%;">Genera Testo nel Mio Stile</button>
    </div>

    <!-- RISULTATO -->
    <div class="card" id="resultCard" style="display:none;">
      <div class="toolbar">
        <div>
          <strong>Testo Pronto</strong>
          <span id="modelUsedBadge" class="status" style="margin-left: 8px;"></span>
        </div>
        <button class="btn btn-secondary" onclick="copiaTutto()">Copia Tutto</button>
      </div>
      <div class="output-box" id="outputBox"></div>
    </div>
  </div>

  <script>
    let testoDocGithub = "";
    let testoFileLocale = "";

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_ufficio_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
        document.getElementById("apiStatus").innerHTML = '<span class="pill-ok">Chiave API caricata dalla memoria privata del browser.</span>';
      }
      caricaDocAutomatico();
    };

    function salvaApiKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      if (!val) return alert("Inserisci prima una chiave API valida.");
      localStorage.setItem("gemini_ufficio_key", val);
      document.getElementById("apiStatus").innerHTML = '<span class="pill-ok">Chiave API salvata correttamente nel browser!</span>';
    }

    async function caricaDocAutomatico() {
      const select = document.getElementById("cliente");
      const option = select.options[select.selectedIndex];
      const fileName = option.getAttribute("data-doc");
      const banner = document.getElementById("autoDocStatus");
      testoDocGithub = "";

      if (!fileName) {
        banner.innerHTML = '<span class="status">Nessun file Word predefinito associato a questa voce.</span>';
        return;
      }

      banner.innerHTML = `<span class="status">Caricamento automatico di <code>dati/${fileName}</code> in corso...</span>`;

      try {
        const response = await fetch(`./dati/${encodeURIComponent(fileName)}?t=${Date.now()}`);
        if (!response.ok) {
          banner.innerHTML = `<span class="pill-warn">File <code>dati/${fileName}</code> non ancora caricato su GitHub.</span>`;
          return;
        }

        const arrayBuffer = await response.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        testoDocGithub = result.value.trim();
        banner.innerHTML = `<span class="pill-ok">Database stile attivo: <code>dati/${fileName}</code> caricato (${testoDocGithub.length} caratteri).</span>`;
      } catch (err) {
        banner.innerHTML = `<span class="pill-warn">Impossibile leggere <code>dati/${fileName}</code>: ${err.message}</span>`;
      }
    }

    async function leggiFileLocale(event) {
      const file = event.target.files[0];
      const status = document.getElementById("fileStatus");
      testoFileLocale = "";
      if (!file) return;

      status.textContent = "Lettura file extra in corso...";
      try {
        if (file.name.endsWith(".docx")) {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          testoFileLocale = result.value.trim();
        } else {
          testoFileLocale = (await file.text()).trim();
        }
        status.innerHTML = `<span class="pill-ok">File extra "${file.name}" aggiunto (${testoFileLocale.length} caratteri).</span>`;
      } catch (err) {
        status.textContent = "Errore nella lettura del file: " + err.message;
      }
    }

    async function generaContenuto() {
      const apiKey = localStorage.getItem("gemini_ufficio_key") || document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) return alert("Incolla e salva prima la tua chiave API di Google AI Studio.");

      const cliente = document.getElementById("cliente").value;
      const modalita = document.getElementById("modalita").value;
      const appunti = document.getElementById("appunti").value.trim();

      if (!appunti && !testoDocGithub && !testoFileLocale) {
        return alert("Inserisci degli appunti oppure carica un file Word prima di generare.");
      }

      const btn = document.getElementById("btnGenera");
      btn.disabled = true;
      btn.textContent = "Generazione in corso...";

      const prompt = `Sei l'assistente editoriale personale di Nico Troiano. Il tuo UNICO compito è replicare fedelmente lo stile, la struttura, le emoji, i separatori, le firme e gli hashtag esatti presenti nel DOCUMENTO UFFICIALE DEL CLIENTE qui sotto, sostituendo solo i dati variabili con quelli forniti negli APPUNTI DEL GIORNO.

CLIENTE: ${cliente}
MODALITÀ: ${modalita}

=== DOCUMENTO UFFICIALE DEL CLIENTE (USA QUESTO COME STAMPO ESATTO!) ===
${testoDocGithub || "Nessun database cliente caricato"}
========================================================================

=== DOCUMENTO EXTRA ALLEGATO ===
${testoFileLocale || "Nessuno"}
================================

=== APPUNTI DEL GIORNO DA INSERIRE ===
${appunti}
======================================

REGOLE TASSATIVE (NON VIOLARE MAI):
1. CLONA IL TEMPLATE DEL DOCUMENTO: Cerca nel Documento Ufficiale la sezione corrispondente agli appunti (es. Next match in casa o in trasferta, Warming up / Riscaldamento, Starting XI / Formazione, Half time, Full time, Post partita, Promo/Offerta, ecc.) e COPIA LA SUA IDENTICA STRUTTURA RIGA PER RIGA, incluse le emoji esatte, i simboli, le righe vuote, la riga di firma (es. AREA COMUNICAZIONE...) e gli hashtag fissi del documento.
2. ZERO FRASI INVENTATE O RETORICA DA AI: Non aggiungere mai frasi motivazionali generiche inventate da te (vietato scrivere cose come "Testa, cuore e grinta", "Avanti tutta", "Un nuovo capitolo", ecc.) se non sono già previste nella struttura del documento. Usa solo lo stile asciutto, diretto e cronachistico degli esempi reali presenti nel Word di Nico.
3. DISTINGUI CASA E TRASFERTA: Se nel documento ci sono template diversi per "Partite in casa" e "Partite in trasferta", usa rigorosamente quello giusto in base agli appunti!
4. NESSUNA INTRODUZIONE: Non scrivere "Ecco il pacchetto...", "Certamente..." o commenti. Restituisci direttamente il testo pronto da copiare.
5. SE MODALITÀ = Standard: restituisci SOLO il testo del post principale pronto da incollare (e, se utile, una riga separata con 2 righe essenziali per la Storia).
6. SE MODALITÀ = Extra: oltre al post principale nel suo stile esatto, aggiungi in fondo [CONCEPT GRAFICO] e [PROMPT IMMAGINE IN INGLESE senza testo].`;

      try {
        const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
        const listData = await listRes.json();
        if (!listRes.ok) throw new Error(listData.error?.message || "Chiave API non valida");

        const modelliDisponibili = (listData.models || [])
          .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
          .map(m => m.name.replace("models/", ""))
          .filter(name => name.includes("gemini") && name.includes("flash"));

        modelliDisponibili.sort((a, b) => b.localeCompare(a));
        const listaDaProvare = modelliDisponibili.length ? modelliDisponibili : ["gemini-3.8-flash", "gemini-2.5-flash-lite"];

        let data = null;
        let modelloUsato = "";
        let ultimoErrore = "";

        for (const modello of listaDaProvare) {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modello}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const json = await res.json();
          if (res.ok) {
            data = json;
            modelloUsato = modello;
            break;
          }
          ultimoErrore = json.error?.message || "Errore API";
        }

        if (!data) throw new Error(ultimoErrore);

        const outputText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Nessuna risposta ricevuta.";
        document.getElementById("outputBox").textContent = outputText;
        document.getElementById("modelUsedBadge").textContent = `(Motore: ${modelloUsato})`;
        document.getElementById("resultCard").style.display = "block";
        document.getElementById("resultCard").scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        alert("Errore: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Genera Testo nel Mio Stile";
      }
    }

    function copiaTutto() {
      const testo = document.getElementById("outputBox").textContent;
      navigator.clipboard.writeText(testo);
      alert("Testo copiato negli appunti!");
    }
  </script>
</body>
</html>
